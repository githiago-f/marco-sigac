<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/css/theme.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .center {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(
        to bottom right,
        var(--color-muted),
        var(--color-accent)
      );
    }

    .card {
      width: 100%;
      max-width: 420px;
    }

    .card-header {
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 22px;
    }

    .card-desc {
      color: var(--color-muted-foreground);
      font-size: 14px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input {
      width: 100%;
      height: 36px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-input-background);
      outline: none;
    }

    .input:focus {
      box-shadow: 0 0 0 3px var(--color-ring);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: var(--color-primary);
      color: var(--color-primary-foreground);
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error {
      background: rgba(220,38,38,0.15);
      color: #991b1b;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="center">

    <div class="card card">

      <div class="card-header">
        <div class="card-title">Sistema de Gestão de Atividades Complementares</div>
        <div class="card-desc">
          Curso Superior de Tecnologia em Sistemas para Internet (SSI)
        </div>
      </div>

      <!-- erro opcional (ex: ?error=true) -->
      <!-- pode ser controlado via Qute -->
      {#if error}
        <div class="error">
          Usuário ou senha inválidos
        </div>
      {/if}

      <form method="POST" action="j_security_check" class="form">

        <!-- IMPORTANTE: nomes padrão do container -->
        <div>
          <label for="j_username">Usuário</label>
          <input
            id="j_username"
            name="j_username"
            placeholder="seu.usuario"
            class="input"
            required
          />
          <p style="font-size:12px;color:var(--color-muted-foreground);margin-top:4px;">
            Mesmo usuário do Moodle POA
          </p>
        </div>

        <div>
          <label for="j_password">Senha</label>
          <input
            id="j_password"
            name="j_password"
            type="password"
            placeholder="••••••••"
            class="input"
            required
          />
        </div>

        <button type="submit" class="btn">
          Entrar
        </button>

      </form>

    </div>

  </div>

  <footer style="text-align:center;padding:16px;font-size:13px;color:var(--color-muted-foreground);">
    Dúvidas? Entre em contato com a Coordenação do Curso pelo e-mail:
    <a href="mailto:ssi@poa.ifrs.edu.br" style="color:var(--color-foreground);">ssi@poa.ifrs.edu.br</a>
  </footer>

</body>
</html>
