<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nova Atividade</title>

  <link rel="stylesheet" href="/css/theme.css">

  <style>
    .container {
      max-width: 700px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .muted {
      color: var(--color-muted-foreground);
      font-size: 14px;
    }

    .input {
      width: 100%;
      height: 36px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-input-background);
      outline: none;
    }

    .input:focus {
      box-shadow: 0 0 0 3px var(--color-ring);
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--color-primary);
      color: var(--color-primary-foreground);
      border: none;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info {
      background: var(--color-muted);
      padding: 12px;
      border-radius: var(--radius-md);
      margin-top: 10px;
    }

    .error {
      background: var(--color-destructive);
      color: var(--color-destructive-foreground);
      padding: 10px;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }

    .success {
      background: color-mix(in oklab, var(--color-primary) 20%, transparent);
      padding: 10px;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }

  </style>
</head>

<body>
  <div class="container">

    <a href="/atividades" class="btn" style="margin-bottom:16px;">
      ← Voltar
    </a>

    <div class="card">

      <h1>Nova Atividade</h1>
      <p class="muted">Envie seu certificado em PDF</p>

      {#if erro}
        <div class="error">{form.erro}</div>
      {/if}

      <form method="POST" action="/atividades" enctype="multipart/form-data">
        <div class="form-group">
          <label>Tipo *</label>
          <select name="tipo" class="input" required>

            {#for t in tipos}
              <option value="{t}">
                {t}
              </option>
            {/for}

          </select>
        </div>

        <div class="form-group">
          <label>Horas *</label>
          <input
            class="input"
            type="number"
            name="horas"
            min="1"
            step="0.5"
            value="{form.horas ?: ''}"
            required
          />
        </div>

        <div class="form-group">
          <label>Certificado *</label>
          <input type="file" name="arquivo" class="input" accept=".pdf" required>
        </div>

        <div class="info">
          <ul>
            <li>PDF obrigatório</li>
            <li>Horas devem bater com certificado</li>
            <li>Máximo total: 70h</li>
          </ul>
        </div>

        <div style="margin-top:16px; display:flex; gap:10px;">
          <a href="/atividades" class="btn">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>

      </form>
    </div>
  </div>
</body>
</html>
