quarkus.security.ldap.enabled=true

quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/
quarkus.http.auth.form.error-page=/?erro=true
quarkus.http.auth.form.landing-page=/atividades

quarkus.http.auth.roles-mapping."aluno"=alunos 
quarkus.http.auth.roles-mapping."professor"=professores

br.edu.ifrs.poa.atividades-complementares.uploads-folder=${UPLOADS_FOLDER:./uploads}

quarkus.security.ldap.dir-context.url=${LDAP_URL:ldap://localhost:3890}
quarkus.security.ldap.dir-context.principal=uid=admin,ou=people,dc=example,dc=com
quarkus.security.ldap.dir-context.password=senha123

quarkus.security.ldap.identity-mapping.rdn-identifier=email
quarkus.security.ldap.identity-mapping.search-base-dn=ou=people,dc=example,dc=com

quarkus.security.ldap.identity-mapping.attribute-mappings."cn".from=cn
quarkus.security.ldap.identity-mapping.attribute-mappings."cn".filter=(member=uid={0},ou=people,dc=example,dc=com)
quarkus.security.ldap.identity-mapping.attribute-mappings."cn".filter-base-dn=ou=groups,dc=example,dc=com

quarkus.security.ldap.identity-mapping.attribute-mappings."displayName".from=displayName
quarkus.security.ldap.identity-mapping.attribute-mappings."displayName".to=displayName
quarkus.security.ldap.identity-mapping.attribute-mappings."displayName".filter=(uid={0})
quarkus.security.ldap.identity-mapping.attribute-mappings."displayName".filter-base-dn=ou=people,dc=example,dc=com

quarkus.datasource.db-kind=${DB_PROVIDER,h2}
quarkus.datasource.username=${DB_USER,user1}
quarkus.datasource.password=${DB_PASSWORD,}

quarkus.datasource.jdbc.url=${DB_CONNECTION_URL:jdbc:h2:mem:default}
quarkus.datasource.jdbc.max-size=${DB_POOLSIZE:1}
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

