quarkus.scheduler.enabled=false

quarkus.mailer.host=localhost
quarkus.mailer.port=25
quarkus.mailer.mock=false

br.edu.ifrs.poa.atividades-complementares.recebido.receivers=interessado-recebido@example.com
br.edu.ifrs.poa.atividades-complementares.recebido.subject=TST recebido - {titulo}
br.edu.ifrs.poa.atividades-complementares.recebido.message-template=Certificado {titulo} recebido. Horas: {horas}.

br.edu.ifrs.poa.atividades-complementares.homologado.receivers=interessado-homologado@example.com
br.edu.ifrs.poa.atividades-complementares.homologado.subject=TST homologado - {titulo}
br.edu.ifrs.poa.atividades-complementares.homologado.message-template=Atividade {titulo} foi homologada para {aluno}.

br.edu.ifrs.poa.atividades-complementares.rejeitado.receivers=interessado-rejeitado@example.com
br.edu.ifrs.poa.atividades-complementares.rejeitado.subject=TST rejeitado - {titulo}
br.edu.ifrs.poa.atividades-complementares.rejeitado.message-template=Atividade {titulo} foi rejeitada para {aluno}.

br.edu.ifrs.poa.atividades-complementares.pendente.receivers=interessado-pendente@example.com
br.edu.ifrs.poa.atividades-complementares.pendente.subject=TST pendente - {titulo}
br.edu.ifrs.poa.atividades-complementares.pendente.message-template=Atividade {titulo} esta pendente para {aluno}.

br.edu.ifrs.poa.atividades-complementares.concluido.receivers=interessado-concluido@example.com
br.edu.ifrs.poa.atividades-complementares.concluido.subject=TST concluido - {aluno}
br.edu.ifrs.poa.atividades-complementares.concluido.message-template=Horas atingidas para {aluno}. Total: {horas}.
