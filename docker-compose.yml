networks:
  my-network:
    driver: bridge

volumes:
  openldap_data:
    driver: local
  postgres-data:
    driver: local

services:
  db:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
     - POSTGRES_PASSWORD=senhapg
     - POSTGRES_USER=usuario-pg
     - POSTGRES_DB=atividades
    volumes: 
     - postgres-data:/var/lib/postgresql/data
    mem_limit: 128m
    cpus: 0.5
  openldap:
    image: lldap/lldap
    ports:
      - 3890:3890
      - 17170:17170
    environment:
      - LLDAP_JWT_SECRET=MhnXYBtz0}d!b{dzopyc<#-}7x+jCMR/
      - LLDAP_LDAP_USER_PASS=senha123
      - LLDAP_VERBOSE=true
    networks:
      - my-network
    volumes:
      - openldap_data:/data

